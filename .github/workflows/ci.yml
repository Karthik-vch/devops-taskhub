name: TaskHub CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/server.js


  docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/karthik-vch/devops-taskhub

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}/frontend:latest .


      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}/backend:latest \
            ./backend


      - name: Push frontend Docker image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/frontend:latest


      - name: Push backend Docker image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/backend:latest